name: Desktop installers

on:
  workflow_dispatch:

jobs:
  build-macos-universal:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: macos-universal
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal macOS DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify macOS bundle
        shell: bash
        run: |
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          mount="$(mktemp -d /tmp/claude-desk-dmg.XXXXXX)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null; rmdir "$mount"' EXIT
          app="$mount/Claude Desk.app"
          expected="$(node -p "require('./package.json').version")"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          test "$actual" = "$expected"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/claude-desk" | grep -q 'universal binary'

      - uses: actions/upload-artifact@v4
        with:
          name: claude-desk-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows-x64:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: windows-x64
          cache-on-failure: true

      # Tauri stores its verified NSIS toolchain here on Windows. The lockfile hash
      # prevents a Tauri CLI upgrade from silently reusing an incompatible toolset.
      - name: Cache Tauri NSIS toolchain
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/tauri/NSIS
          key: ${{ runner.os }}-tauri-nsis-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Write-Warning "NSIS build attempt $attempt failed; retrying on the same runner."
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $app = "src-tauri/target/x86_64-pc-windows-msvc/release/claude-desk.exe"
          $stream = [System.IO.File]::OpenRead($app)
          $reader = $null
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 0x5c
            $subsystem = $reader.ReadUInt16()
          } finally {
            if ($null -ne $reader) { $reader.Dispose() }
            $stream.Dispose()
          }
          Write-Host "Windows PE subsystem: $subsystem"
          if ($subsystem -ne 2) { throw "Expected Windows GUI subsystem (2), got $subsystem" }

      - name: Smoke test installer and app launch
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $uninstall = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq "Claude Desk" |
            Select-Object -First 1
          if (-not $uninstall.InstallLocation) { throw "Claude Desk installation was not registered" }

          $installLocation = $uninstall.InstallLocation.Trim('"')
          $app = Get-ChildItem $installLocation -Filter "claude-desk.exe" -Recurse | Select-Object -First 1
          if (-not $app) { throw "Installed Claude Desk executable was not found" }
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "Claude Desk exited during launch smoke test" }

          $second = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 3
          $second.Refresh()
          $process.Refresh()
          if (-not $second.HasExited) { throw "A second Claude Desk instance remained running" }
          if ($process.HasExited) { throw "The original Claude Desk instance exited after a second launch" }
          Stop-Process -Id $process.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: claude-desk-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
