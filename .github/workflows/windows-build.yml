name: Windows internal build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-support

jobs:
  build-windows-x64:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build NSIS installer
        run: pnpm tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: claude-desk-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
